services:
  - type: web
    name: flower-3d-backend
    env: php
    rootDir: backend
    buildCommand: >
      composer install --no-interaction --prefer-dist --optimize-autoloader &&
      php artisan optimize:clear &&
      php artisan config:clear &&
      php artisan route:clear &&
      php artisan view:clear &&
      php artisan migrate --force &&
      php artisan db:seed --class=AdminSeeder --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      # Secret: must be the same base64 key as backend/.env (both use one database;
      # it signs badge/leave QR codes and encrypts leave sessions). Set it in the dashboard.
      - key: APP_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://bloomcraft-app.vercel.app
      - key: APP_URL
        value: https://flower-3d.onrender.com
      - key: PAYMONGO_SUBSCRIPTION_CALLBACK_URL
        value: https://flower-3d.onrender.com
