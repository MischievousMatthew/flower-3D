services:
  - type: web
    name: flower-3d-backend
    # Render has no PHP runtime: the site runs from backend/Dockerfile (Apache
    # on port 10000), which also migrates and seeds the admin on start
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      # Never show stack traces to visitors
      - key: APP_DEBUG
        value: "false"
      # Secret: must be the same base64 key as backend/.env (both use one database;
      # it signs badge/leave QR codes and encrypts leave sessions). Set it in the dashboard.
      - key: APP_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://bloomcraft-app.vercel.app
      - key: APP_URL
        value: https://flower-3d.onrender.com
      - key: PAYMONGO_SUBSCRIPTION_CALLBACK_URL
        value: https://flower-3d.onrender.com
